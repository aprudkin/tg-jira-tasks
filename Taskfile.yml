version: '3'

vars:
  REPO_ROOT:
    sh: git rev-parse --show-toplevel

includes:
  docker:
    taskfile: .tasks.d/docker.yml
    optional: false

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  init:
    desc: Initialize development environment
    cmds:
      - task: docker:build
      - task: docker:up
      - echo "Bot stack is ready."

  test:
    desc: Run the full pytest suite in the locked uv environment
    cmds:
      - uv run --locked --group dev python -m pytest tests/ -v

  status:
    desc: Show status of the bot stack
    cmds:
      - echo "=== 🐳 Контейнеры ==="
      - task: docker:ps
      - echo ""
      - echo "=== 📊 Использование ресурсов ==="
      - 'docker compose stats --no-stream --format "table {{ "{{" }}.Name{{ "}}" }}\t{{ "{{" }}.CPUPerc{{ "}}" }}\t{{ "{{" }}.MemUsage{{ "}}" }}\t{{ "{{" }}.NetIO{{ "}}" }}" 2>/dev/null || echo "Контейнеры не запущены"'
      - echo ""
      - echo "=== 💾 Volumes ==="
      - 'docker volume ls --filter name=tg-jira-tasks --format "table {{ "{{" }}.Name{{ "}}" }}\t{{ "{{" }}.Driver{{ "}}" }}"'
      - echo ""
      - echo "=== 📦 Образы ==="
      - docker compose images --format table

  deploy:
    desc: "Deploy committed HEAD to PROD with bounded payload, state backup, readiness check and rollback."
    dir: "{{.REPO_ROOT}}"
    prompt: "Deploy committed HEAD to PROD (sf-bot-app01 / 143.110.233.82)?"
    cmds:
      - python3 scripts/deploy.py
    interactive: true

  deploy:dry:
    desc: "Preflight PROD and show the committed-snapshot rsync dry-run; do not upload or restart."
    dir: "{{.REPO_ROOT}}"
    cmds:
      - python3 scripts/deploy.py --dry-run
    interactive: true
