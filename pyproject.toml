[project]
name = "tg-jira-tasks"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiogram>=3.3.0",
    "jira==3.10.5",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
required-version = ">=0.12.12,<0.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
